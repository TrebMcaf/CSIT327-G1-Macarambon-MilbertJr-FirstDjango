<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}CampusConnect{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>
    <body class="bg-light">
        <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
            <div class="container">
                <a class="navbar-brand" href="{% url 'dashboard' %}">CampusConnect</a>
                <div class="d-flex align-items-center gap-3">
                    {% if user.is_authenticated %}
                        <a class="nav-link text-white p-0" href="{% url 'profile' %}">My Profile</a>
                        <span class="text-white small">Hi, {{ user.username }}!</span>
                        <form method="post" action="{% url 'logout' %}" class="m-0">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
                        </form>
                    {% else %}
                        <a class="nav-link text-white p-0" href="{% url 'login' %}">Log in</a>
                        <a class="btn btn-outline-light btn-sm" href="{% url 'signup' %}">Sign up</a>
                    {% endif %}
                </div>
            </div>
        </nav>

        <main class="container">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
            {% block content %}{% endblock %}
        </main>

        <footer class="container text-center text-muted small mt-5 mb-4">
            {% block footer %}{% endblock %}
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
